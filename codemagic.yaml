workflows:
  android-banh-mi:
    name: Build APK Do Banh Mi
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Cai dat dependencies
        script: |
          ls -la
          cat package.json || echo "chua co package.json"
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Them Android platform
        script: |
          ls -la
          mkdir -p www
          ls www || echo "www trong"
          if [ ! -f www/index.html ]; then echo "THIEU www/index.html - can up file game len"; exit 1; fi
          if [ ! -f capacitor.config.ts ]; then
            printf "import type { CapacitorConfig } from '@capacitor/cli';\nconst config: CapacitorConfig = { appId: 'com.banhmi.dobanhmi', appName: 'Do Banh Mi', webDir: 'www' };\nexport default config;\n" > capacitor.config.ts
          fi
          ./node_modules/.bin/cap add android || echo "android da co"
          ./node_modules/.bin/cap sync android
      - name: Build APK Debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
